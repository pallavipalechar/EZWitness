<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Cache-control" content="no-cache" charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/3.0.4/socket.io.js" integrity="sha512-aMGMvNYu8Ue4G+fHa359jcPb1u+ytAF+P2SCb+PxrjCdO3n3ZTxJ30zuH39rimUggmTwmh2u7wvQsDTHESnmfQ==" crossorigin="anonymous"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .navbar-brand {
      font-family: 'Merriweather';
      font-size: 30px;
      display: flex;
      align-items: center;
    }
    .navbar-brand img {
      max-height: 40px;
      margin-right: 10px; /* Adjust spacing as needed */
    }

    .inner {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      text-align: center;
      margin-top: 10px;
      margin-bottom: 10px;
      border-style: solid;
      width: 100%;
      height: 70vh;
      box-sizing: border-box;
      color: black;
      padding: 10px;
    }
    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
    .header-container h3 {
      margin: 0;
      font-size: small;
    }
    .header-container button {
      margin-left: 10px;
    }
    .date-time {
      color: white;
      margin-left: auto;
      text-align: right;
      font-size: 18px;
    }
    
    .logo-image{
    width: 46px;
    height: 46px;
    border-radius: 50%;
    overflow: hidden;
    margin-top: -6px;
}
    @media screen and (orientation: landscape) {
      .inner {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">
        <div class="logo-image">
              <img src="/opt/lampp/htdocs/ez/td/templates/logo.png" class="img-fluid">
        </div>
        <div id="cname"> EZ Technologies</div>
  </a>
      
      <div class="date-time" id="dateTime"></div>
    </div>
  </nav>
  <div class="container">
    <div class="inner">
      <div class="header-container">
        <div id="header"><h3>Websocket Connected</h3></div>
        <button class="btn btn-primary" id="checkbutton" onClick="myupdate()" style="display: none;">Submit</button>
      </div>
      <div id="demo">
</div>
    </div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const socket = io(); // socketio connection to server

      socket.on("connect", () => {
        console.log("connected");
        document.getElementById("header").innerHTML = "<h3>Websocket Connected</h3>";
        socket.emit("my_event", function() {});
      });

      socket.on("disconnect", () => {
        console.log("disconnected");
        document.getElementById("header").innerHTML = "<h3>Websocket Disconnected</h3>";
      });

      socket.on("server", function(msg) {
        let myvar = JSON.parse(msg.data1);
        // Check if entire data is sent by server
        if (myvar == "4") {
          document.getElementById("demo").innerHTML = "";
          document.querySelector('#checkbutton').innerText = "Submit";
          document.getElementById("checkbutton").style.cursor = "pointer";
          document.getElementById("checkbutton").disabled = false;
          document.getElementById("checkbutton").className = "btn btn-primary";
        } else {
          let demoDiv = document.getElementById("demo");
          demoDiv.innerHTML += msg.data + "<br>";

          // Split the content by <br> tags to create an array of lines
          let lines = demoDiv.innerHTML.split("<br>");

          // If the number of lines exceeds 4, remove the excess lines
          if (lines.length > 5) { // 5 because split creates an additional empty string at the end
            lines = lines.slice(lines.length - 5);
          }

          // Join the lines back together and update the innerHTML
          demoDiv.innerHTML = lines.join("<br>");
          demoDiv.style.fontSize = "30px"; // Increase the text size
        }
      });

      function myupdate() {
        // Event sent by Client
        socket.emit("my_event", function() {});
      }

      function updateDateTime() {
        const now = new Date();
        const formattedDate = now.toLocaleDateString();
        const formattedTime = now.toLocaleTimeString();
        document.getElementById('dateTime').innerHTML = `${formattedDate}<br>${formattedTime}`;
      }
      
      

      setInterval(updateDateTime, 1000);
      updateDateTime(); // Initial call to set date and time immediately
    });
  </script>
</body>
</html>
