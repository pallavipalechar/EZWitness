<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date-Time Ticker</title>
    <style>
        .ticker {
            font-size: 24px;
            font-family: Arial, sans-serif;
            margin: 20px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.4.1/socket.io.min.js"></script>
</head>
<body>
    <div class="ticker" id="dateTimeTicker">
        Current Date and Time: 
    </div>

    <script>
        var socket = io();

        socket.on('update_time', function(data) {
            document.getElementById('dateTimeTicker').innerText = "Current Date and Time: " + data.current_date_time;
        });
    </script>
</body>
</html>
